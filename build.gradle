plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "JitPack"
        url = "https://jitpack.io"
    }
    maven {
        name = "Bawnorton"
        url = "https://maven.bawnorton.com/releases"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modCompileOnly "maven.modrinth:flashback:${project.flashback_version}-fabric,1.21.1"

    // LWJGL TinyEXR — unified version via BOM, same approach as ReplayMod
    def lwjglVersion = "3.3.4"
    def lwjglNatives = "natives-windows"
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        lwjglNatives = org.gradle.internal.os.OperatingSystem.current().nativePrefix.contains("aarch64")
            ? "natives-macos-arm64" : "natives-macos"
    } else if (org.gradle.internal.os.OperatingSystem.current().isLinux()) {
        lwjglNatives = "natives-linux"
    }

    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation "org.lwjgl:lwjgl-tinyexr"
    runtimeOnly "org.lwjgl:lwjgl-tinyexr::${lwjglNatives}"

    // Bundle tinyexr JARs in META-INF/jars/ for production
    include "org.lwjgl:lwjgl-tinyexr:${lwjglVersion}"
    def nativeDep = dependencies.create("org.lwjgl:lwjgl-tinyexr:${lwjglVersion}:${lwjglNatives}")
    include nativeDep
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
